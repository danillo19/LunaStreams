task:
  id: audio_only_fast
  inputs:
    - stream: audio_chunk
  outputs:
    - stream: presence_decision
    - stream: presence_strategy
    - sink: presence_sink
    - sink: strategy_sink
  operation_profiles:
    - operation: loud_audio_presence
      cost: 7
      weight: 0.95
      latency_ms: 40
    - operation: soft_audio_presence
      cost: 1
      weight: 0.45
      latency_ms: 8
  operation_configs:
    - operation: microphone_source
      config:
        sample_rate: 16000
        channels: 1
        frames_per_chunk: 1024
    - operation: loud_audio_presence
      config:
        threshold: 0.12
    - operation: soft_audio_presence
      config:
        threshold: 0.04
    - operation: presence_choice_selector
      config:
        default_choice: plan_inactive
        tick_ms: 100
        variants:
          - stream: loud_audio_presence
            kind: bool
            label: loud_audio
          - stream: soft_audio_presence
            kind: bool
            label: soft_audio
  constraints:
    min_total_weight: 0.40
    max_total_latency_ms: 10
  objective:
    primary: min_latency
    secondary: min_cost
  # Ожидаемо: soft_audio_presence
