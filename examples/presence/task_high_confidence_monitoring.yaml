task:
  id: high_confidence_monitoring
  inputs:
    - stream: audio_chunk
    - stream: pressed_key
  outputs:
    - stream: presence_decision
    - stream: presence_strategy
    - sink: presence_sink
    - sink: strategy_sink
  operation_profiles:
    - operation: loud_audio_presence
      cost: 7
      weight: 0.95
      latency_ms: 40
    - operation: soft_audio_presence
      cost: 1
      weight: 0.45
      latency_ms: 8
    - operation: keyboard_source
      cost: 2
      weight: 0.40
      latency_ms: 2
    - operation: face_presence
      cost: 15
      weight: 0.98
      latency_ms: 60
  operation_configs:
    - operation: microphone_source
      config:
        sample_rate: 16000
        channels: 1
        frames_per_chunk: 1024
    - operation: loud_audio_presence
      config:
        threshold: 0.12
    - operation: soft_audio_presence
      config:
        threshold: 0.04
    - operation: presence_choice_selector
      config:
        default_choice: plan_inactive
        tick_ms: 100
        variants:
          - stream: loud_audio_presence
            kind: bool
            label: loud_audio
          - stream: soft_audio_presence
            kind: bool
            label: soft_audio
          - stream: pressed_key
            kind: recent_key
            label: recent_keyboard
            window_ms: 1500
  constraints:
    min_total_weight: 0.90
    max_total_latency_ms: 50
  objective:
    primary: min_cost
    secondary: max_weight
  # Ожидаемо: loud_audio_presence
