# Постановки задачи для модели из presence.yaml.
#
# Каждый task_variant задаёт только:
#   - какие входные streams считаются доступными;
#   - какие выходные streams нужны;
#   - нефункциональные профили операций (cost / weight / latency_ms);
#   - ограничения (constraints) и целевую функцию (objective).

task_variants:
  - id: low_cost_interactive
    inputs:
      - stream: audio_chunk
      - stream: pressed_key
    outputs:
      - stream: presence_decision
      - stream: presence_strategy
    operation_profiles:
      - operation: loud_audio_presence
        cost: 7
        weight: 0.95
        latency_ms: 40
      - operation: soft_audio_presence
        cost: 1
        weight: 0.45
        latency_ms: 8
      - operation: keyboard_source
        cost: 2
        weight: 0.40
        latency_ms: 2
      - operation: face_presence
        cost: 15
        weight: 0.98
        latency_ms: 60
    constraints:
      min_total_weight: 0.80
      max_total_latency_ms: 20
    objective:
      primary: min_cost
      secondary: min_latency
    # Ожидаемо может привести к плану:
    # soft_audio_presence + keyboard_source

  - id: high_confidence_monitoring
    inputs:
      - stream: audio_chunk
      - stream: pressed_key
    outputs:
      - stream: presence_decision
      - stream: presence_strategy
    operation_profiles:
      - operation: loud_audio_presence
        cost: 7
        weight: 0.95
        latency_ms: 40
      - operation: soft_audio_presence
        cost: 1
        weight: 0.45
        latency_ms: 8
      - operation: keyboard_source
        cost: 2
        weight: 0.40
        latency_ms: 2
      - operation: face_presence
        cost: 15
        weight: 0.98
        latency_ms: 60
    constraints:
      min_total_weight: 0.90
      max_total_latency_ms: 50
    objective:
      primary: min_cost
      secondary: max_weight
    # Ожидаемо может привести к плану:
    # loud_audio_presence

  - id: audio_only_fast
    inputs:
      - stream: audio_chunk
    outputs:
      - stream: presence_decision
      - stream: presence_strategy
    operation_profiles:
      - operation: loud_audio_presence
        cost: 7
        weight: 0.95
        latency_ms: 40
      - operation: soft_audio_presence
        cost: 1
        weight: 0.45
        latency_ms: 8
    constraints:
      min_total_weight: 0.40
      max_total_latency_ms: 10
    objective:
      primary: min_latency
      secondary: min_cost
    # Ожидаемо может привести к плану:
    # soft_audio_presence

  - id: keyboard_only_degraded
    inputs:
      - stream: pressed_key
    outputs:
      - stream: presence_decision
      - stream: presence_strategy
    operation_profiles:
      - operation: keyboard_source
        cost: 2
        weight: 0.40
        latency_ms: 2
    constraints:
      min_total_weight: 0.35
      max_total_latency_ms: 5
    objective:
      primary: min_cost
      secondary: min_latency
    # Ожидаемо может привести к плану:
    # keyboard_source

  - id: camera_vision_accurate
    inputs:
      - stream: camera_frame
    outputs:
      - stream: presence_decision
      - stream: presence_strategy
    operation_profiles:
      - operation: face_presence
        cost: 15
        weight: 0.98
        latency_ms: 60
    constraints:
      min_total_weight: 0.90
      max_total_latency_ms: 100
    objective:
      primary: max_weight
      secondary: min_cost
    # Ожидаемо может привести к плану:
    # face_presence (python subprocess)

  - id: frontend_full
    # Постановка для веб-интерфейса: включаем все доступные источники
    # (микрофон + камера), чтобы frontend sink мог показать и видео, и
    # audio-метр, и presence-индикатор. Camera_frame и audio_chunk явно
    # перечислены в outputs, чтобы planner оставил их producers в плане.
    inputs:
      - stream: audio_chunk
      - stream: camera_frame
    outputs:
      - stream: presence_decision
      - stream: presence_strategy
      - stream: camera_frame
      - stream: audio_chunk
    operation_profiles:
      - operation: soft_audio_presence
        cost: 1
        weight: 0.45
        latency_ms: 8
      - operation: face_presence
        cost: 15
        weight: 0.98
        latency_ms: 60
    constraints:
      min_total_weight: 0.95
      max_total_latency_ms: 80
    objective:
      primary: max_weight
      secondary: min_cost
    # Ожидаемо planner оставит face_presence (+ soft_audio) и все источники,
    # включая microphone_source и camera_source — чтобы frontend.web мог
    # отрисовать camera_frame и audio RMS.

  - id: camera_plus_soft_audio
    inputs:
      - stream: audio_chunk
      - stream: camera_frame
    outputs:
      - stream: presence_decision
      - stream: presence_strategy
    operation_profiles:
      - operation: soft_audio_presence
        cost: 1
        weight: 0.45
        latency_ms: 8
      - operation: face_presence
        cost: 15
        weight: 0.98
        latency_ms: 60
    constraints:
      min_total_weight: 0.95
      max_total_latency_ms: 80
    objective:
      primary: max_weight
      secondary: min_cost
    # Ожидаемо может привести к плану:
    # face_presence (+ soft_audio, если нужна дополнительная ветка)
