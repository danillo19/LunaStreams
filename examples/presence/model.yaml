model:
  operations:
    - id: microphone_source
      kind: source
      mode: always_on
      impl: microphone.capture
      outputs:
        - stream: audio_chunk

    - id: loud_audio_presence
      kind: transform
      mode: task_per_event
      impl: audio.volume_presence
      inputs:
        - stream: audio_chunk
      outputs:
        - stream: loud_audio_presence

    - id: soft_audio_presence
      kind: transform
      mode: task_per_event
      impl: audio.volume_presence
      inputs:
        - stream: audio_chunk
      outputs:
        - stream: soft_audio_presence

    - id: keyboard_source
      kind: source
      mode: always_on
      impl: keyboard.read
      outputs:
        - stream: pressed_key

    # --- Python-операции: камера + компьютерное зрение ------------------
    # Источник кадров реализован как Python subprocess. Go-runtime не
    # зависит от Python — он запускает команду и общается с ней через
    # stdin/stdout по контракту polyglot-operation (см. docs/operation-interface.md).
    - id: camera_source
      kind: source
      mode: always_on
      impl: camera.capture
      runtime:
        kind: subprocess
        command:
          - sh
          - ops/subprocess/python/run_camera_capture.sh
      outputs:
        - stream: camera_frame

    # Детекция лица — Python subprocess. OpenCV + Haar cascade.
    - id: face_presence
      kind: transform
      mode: task_per_event
      impl: cv.face_presence
      runtime:
        kind: subprocess
        command:
          - sh
          - ops/subprocess/python/run_face_presence.sh
      inputs:
        - stream: camera_frame
      outputs:
        - stream: face_presence

    # --- Aggregator: сводит несколько источников сигналов в одно решение ---
    # Список возможных входов (inputs) — структурная часть модели.
    # Набор variants и пороги приходят из конкретной задачи.
    - id: presence_choice_selector
      kind: transform
      mode: always_on
      impl: selector.redundant_choice
      inputs:
        - stream: loud_audio_presence
        - stream: soft_audio_presence
        - stream: pressed_key
        - stream: face_presence
      outputs:
        - stream: presence_decision
        - stream: presence_strategy

    - id: presence_sink
      kind: sink
      mode: task_per_event
      impl: output.console
      inputs:
        - stream: presence_decision

    - id: strategy_sink
      kind: sink
      mode: task_per_event
      impl: output.console
      inputs:
        - stream: presence_strategy

    # --- Frontend sink: HTTP + Server-Sent Events -----------------------
    # Реализован как Go-sink (impl: frontend.web), но для runtime это
    # обычный sink. При желании его можно заменить на Node.js/Python
    # subprocess (runtime.kind: subprocess) или на выделенный сервис
    # (runtime.kind: http/grpc) — engine менять не нужно.
    - id: frontend_sink
      kind: sink
      mode: task_per_event
      impl: frontend.web
      inputs:
        - stream: camera_frame
        - stream: audio_chunk
        - stream: presence_decision
        - stream: presence_strategy

    # --- Runtime simulator: generic HTTP/SSE view of engine telemetry ----
    # Не зависит от presence payloads: этот sink можно добавить в любую
    # задачу, чтобы увидеть live-граф операторов и stream-событий.
    - id: runtime_simulator_sink
      kind: sink
      mode: task_per_event
      impl: runtime.simulator

  streams:
    - id: audio_chunk
      type: audio_chunk

    - id: loud_audio_presence
      type: bool

    - id: soft_audio_presence
      type: bool

    - id: pressed_key
      type: text

    - id: camera_frame
      type: video_frame

    - id: face_presence
      type: bool

    - id: presence_decision
      type: bool

    - id: presence_strategy
      type: text
