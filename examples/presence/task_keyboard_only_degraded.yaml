task:
  id: keyboard_only_degraded
  inputs:
    - stream: pressed_key
  outputs:
    - stream: presence_decision
    - stream: presence_strategy
    - sink: presence_sink
    - sink: strategy_sink
  operation_profiles:
    - operation: keyboard_source
      cost: 2
      weight: 0.40
      latency_ms: 2
  operation_configs:
    - operation: presence_choice_selector
      config:
        default_choice: plan_inactive
        tick_ms: 100
        variants:
          - stream: pressed_key
            kind: recent_key
            label: recent_keyboard
            window_ms: 1500
  constraints:
    min_total_weight: 0.35
    max_total_latency_ms: 5
  objective:
    primary: min_cost
    secondary: min_latency
  # Ожидаемо: keyboard_source
